services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      # Keeps uploads, logins and reviews between restarts. Remove to start from the bundled database each time.
      - dealerpulse-data:/app/data
    restart: unless-stopped
volumes:
  dealerpulse-data: